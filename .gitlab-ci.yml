workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages: [build, deploy, release]

default:
  image: zilber-portal-node-build:24-vips8.18.6
  tags: [zilber-portal]
  interruptible: true

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=2048"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

build:
  stage: build
  cache:
    when: always
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm explore sharp -- npm run build
    - node ops/qa/profile-photo.mjs
    - npm run build
    - node ops/ci/package-release.mjs
  artifacts:
    name: "portal-$CI_COMMIT_SHORT_SHA"
    paths: [portal-release.tar.gz, portal-release.tar.gz.sha256]
    expire_in: 30 days

deploy_production:
  stage: deploy
  needs: [build]
  interruptible: false
  resource_group: portal-production
  environment:
    name: production
    url: https://portal.zilber.tech
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client ca-certificates
    - install -d -m 700 ~/.ssh
    - install -m 600 "$PORTAL_DEPLOY_KEY" ~/.ssh/id_ed25519
    - install -m 600 "$PORTAL_SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - sha256sum -c portal-release.tar.gz.sha256
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 portal-ci@158.255.74.30 < portal-release.tar.gz
    - node ops/ci/verify-release.mjs

publish_release:
  stage: release
  needs: [deploy_production]
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - node ops/ci/publish-release.mjs
